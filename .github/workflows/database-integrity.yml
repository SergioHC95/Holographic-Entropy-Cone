name: database integrity

on:
  pull_request:
  push:
    # Validate a clean candidate head before the coordinated main-history cutover.
    branches: [main, "codex/lfs-free-main-*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read

env:
  HEC_CHECK_WORKERS: "2"
  NUMBA_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

concurrency:
  group: database-integrity-proof-work-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: code quality and tests
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/n=6/graph-shards/*.json
            !/data/n=6/ray-shards/*.json
            !/data/n=*/witness-shards/*.witnesspack
            !/data/n=*/proof-shards/*.proofpack
            /data/n=[1-5]/proof-shards/*.proofpack
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.13.14"
          enable-cache: true
      - run: uv sync --locked --dev --python 3.13.14
      - run: bash .github/scripts/lint_workflows.sh
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - name: Build installed-package exact primitives
        run: |
          uv run --no-sync hec native build --directory "$RUNNER_TEMP/hec-native"
          echo "HEC_NATIVE_DIR=$RUNNER_TEMP/hec-native" >> "$GITHUB_ENV"
      - name: Run every portable test in the exact complete test plan
        env:
          EXPECTED_TEST_PLAN: ${{ needs.discover.outputs.test_plan_sha256 }}
        run: uv run --no-sync python tests/ci_tests.py --partition unit --expected-plan "$EXPECTED_TEST_PLAN"

  catalogue:
    name: catalogue integration
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    # Full-catalogue integration has the same resource budget as mathematical
    # audits; the short portable job no longer duplicates this growing work.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/n=*/graph-shards/*.json
            !/data/n=*/ray-shards/*.json
            !/data/n=*/proof-shards/*.proofpack
            !/data/n=*/witness-shards/*.witnesspack
            /data/n=[1-5]/proof-shards/*.proofpack
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.13.14"
          enable-cache: true
      - run: uv sync --locked --dev --python 3.13.14
      - name: Materialize the complete catalogue only when full integration is required
        if: ${{ needs.discover.outputs.catalogue_mode == 'full' }}
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_BASE: ${{ needs.discover.outputs.base }}
          AUDIT_MODE: ${{ needs.discover.outputs.mode }}
          BASELINE_RUN: ${{ needs.discover.outputs.baseline_run }}
          BASELINE_GATE: ${{ needs.discover.outputs.baseline_gate }}
          AUDIT_PLAN: ${{ needs.discover.outputs.plan_sha256 }}
        run: |
          uv run --no-sync python -m hec.ci_checks materialize --purpose catalogue \
            --base "$AUDIT_BASE" --mode "$AUDIT_MODE" --baseline-run "$BASELINE_RUN" \
            --baseline-gate "$BASELINE_GATE" --expected-plan "$AUDIT_PLAN"
      - name: Build installed-package exact primitives
        if: ${{ needs.discover.outputs.catalogue_mode == 'full' }}
        run: |
          uv run --no-sync hec native build --directory "$RUNNER_TEMP/hec-native"
          echo "HEC_NATIVE_DIR=$RUNNER_TEMP/hec-native" >> "$GITHUB_ENV"
      - name: Run every catalogue test in the same complete test plan
        if: ${{ needs.discover.outputs.catalogue_mode == 'full' }}
        env:
          EXPECTED_TEST_PLAN: ${{ needs.discover.outputs.test_plan_sha256 }}
        run: uv run --no-sync python tests/ci_tests.py --partition catalogue --expected-plan "$EXPECTED_TEST_PLAN"
      - name: Verify affected metadata and counts with authenticated prior integration reuse
        if: ${{ needs.discover.outputs.catalogue_mode == 'incremental' }}
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_BASE: ${{ needs.discover.outputs.base }}
          AUDIT_MODE: ${{ needs.discover.outputs.mode }}
          BASELINE_RUN: ${{ needs.discover.outputs.baseline_run }}
          BASELINE_GATE: ${{ needs.discover.outputs.baseline_gate }}
          AUDIT_PLAN: ${{ needs.discover.outputs.plan_sha256 }}
        run: |
          uv run --no-sync python -m hec.ci_checks catalogue --base "$AUDIT_BASE" --mode "$AUDIT_MODE" \
            --baseline-run "$BASELINE_RUN" --baseline-gate "$BASELINE_GATE" --expected-plan "$AUDIT_PLAN"

  discover:
    name: discover datasets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.datasets.outputs.matrix }}
      test_plan_sha256: ${{ steps.tests.outputs.test_plan_sha256 }}
      plan_sha256: ${{ steps.datasets.outputs.plan_sha256 }}
      mode: ${{ steps.datasets.outputs.mode }}
      catalogue_mode: ${{ steps.datasets.outputs.catalogue_mode }}
      base: ${{ steps.datasets.outputs.base }}
      baseline_run: ${{ steps.datasets.outputs.baseline_run }}
      baseline_gate: ${{ steps.datasets.outputs.baseline_gate }}
      tested_commit: ${{ steps.datasets.outputs.tested_commit }}
      tested_tree: ${{ steps.datasets.outputs.tested_tree }}
      verifier: ${{ steps.datasets.outputs.verifier }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/n=*/graph-shards/*.json
            !/data/n=*/ray-shards/*.json
            !/data/n=*/witness-shards/*.witnesspack
            !/data/n=*/proof-shards/*.proofpack
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.13.14"
          enable-cache: true
      - run: uv sync --locked --dev --python 3.13.14
      - id: datasets
        name: Authenticate baseline and plan exact affected mathematical audits
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python -m hec.ci_checks plan --github-output "$GITHUB_OUTPUT"
      - id: tests
        name: Discover the complete disjoint unittest plan without executing cases
        run: uv run --no-sync python tests/ci_tests.py --github-output "$GITHUB_OUTPUT"

  storage:
    name: ordinary Git data and complete main-ancestry hygiene
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/n=*/graph-shards/*.json
            !/data/n=*/ray-shards/*.json
            !/data/n=*/witness-shards/*.witnesspack
            !/data/n=*/proof-shards/*.proofpack
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.13.14"
          enable-cache: true
      - run: uv sync --locked --no-dev --python 3.13.14
      - name: Verify current bytes and history, reusing only authenticated prior coverage
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_BASE: ${{ needs.discover.outputs.base }}
          AUDIT_MODE: ${{ needs.discover.outputs.mode }}
          BASELINE_RUN: ${{ needs.discover.outputs.baseline_run }}
          BASELINE_GATE: ${{ needs.discover.outputs.baseline_gate }}
          AUDIT_PLAN: ${{ needs.discover.outputs.plan_sha256 }}
        run: |
          uv run --no-sync python -m hec.ci_checks storage --base "$AUDIT_BASE" --mode "$AUDIT_MODE" \
            --baseline-run "$BASELINE_RUN" --baseline-gate "$BASELINE_GATE" --expected-plan "$AUDIT_PLAN"

  validate:
    # Complete both portable platforms before queuing the expensive audit
    # matrix. A missing quality runner still fails the final required gate.
    needs: [discover, quality]
    if: ${{ !cancelled() && needs.discover.result == 'success' && needs.quality.result == 'success' }}
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Every complete proof belongs to one full-cube audit partition.
      # Metadata jobs confer no validity; the gate requires ALL audit partitions.
      # Ray ranks use finer, measured-cost contiguous ranges. The planner and
      # executor bind those hints to the same ordered ray catalogue bytes.
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/n=*/graph-shards/*.json
            !/data/n=*/ray-shards/*.json
            !/data/n=*/witness-shards/*.witnesspack
            !/data/n=*/proof-shards/*.proofpack
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.13.14"
          enable-cache: true
      - run: uv sync --locked --no-dev --python 3.13.14
      - name: Build standard exact decoder and full-cube verifier
        if: ${{ matrix.kind == 'contractions' }}
        run: |
          uv run --no-sync hec native build --directory "$RUNNER_TEMP/hec-native"
          echo "HEC_NATIVE_DIR=$RUNNER_TEMP/hec-native" >> "$GITHUB_ENV"
          echo "HEC_RECONSTRUCTION_WORKING_BYTES=268435456" >> "$GITHUB_ENV"
      - name: Execute the exact planned mathematical selection or verify authenticated reuse
        env:
          HEC_CHECK_WORKERS: "4"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          NUMBA_NUM_THREADS: "1"
          GH_TOKEN: ${{ github.token }}
          AUDIT_BASE: ${{ needs.discover.outputs.base }}
          AUDIT_MODE: ${{ needs.discover.outputs.mode }}
          BASELINE_RUN: ${{ needs.discover.outputs.baseline_run }}
          BASELINE_GATE: ${{ needs.discover.outputs.baseline_gate }}
          AUDIT_PLAN: ${{ needs.discover.outputs.plan_sha256 }}
          AUDIT_TASK: ${{ matrix.task_id }}
        run: |
          uv run --no-sync python -m hec.ci_checks run --base "$AUDIT_BASE" --mode "$AUDIT_MODE" \
            --baseline-run "$BASELINE_RUN" --baseline-gate "$BASELINE_GATE" \
            --expected-plan "$AUDIT_PLAN" --task "$AUDIT_TASK"

  distribution:
    name: installed wheel and exact small-corpus acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/n=6/graph-shards/*.json
            !/data/n=6/ray-shards/*.json
            !/data/n=*/witness-shards/*.witnesspack
            !/data/n=*/proof-shards/*.proofpack
            /data/n=[1-5]/proof-shards/*.proofpack
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.13.14"
          enable-cache: true
      - name: Build the source distribution and its installable wheel
        run: |
          uv build --sdist --python 3.13.14 --out-dir "$RUNNER_TEMP/hec-source"
          uv build "$RUNNER_TEMP/hec-source/"*.tar.gz --wheel --python 3.13.14 --out-dir "$RUNNER_TEMP/hec-dist"
      - name: Install exactly locked runtime dependencies and the wheel
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/hec-requirements.txt"
          uv venv --python 3.13.14 "$RUNNER_TEMP/hec-wheel"
          uv pip sync --python "$RUNNER_TEMP/hec-wheel/bin/python" "$RUNNER_TEMP/hec-requirements.txt"
          uv pip install --no-deps --python "$RUNNER_TEMP/hec-wheel/bin/python" "$RUNNER_TEMP/hec-dist/"*.whl
      - name: Verify from outside the checkout with no research modules or source-path fallback
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ""
        run: |
          "$RUNNER_TEMP/hec-wheel/bin/python" "$GITHUB_WORKSPACE/tests/wheel_smoke.py" \
            --repository "$GITHUB_WORKSPACE" --native-directory "$RUNNER_TEMP/hec-wheel-native"

  gate:
    name: database integrity
    if: ${{ always() }}
    needs: [quality, catalogue, distribution, storage, discover, validate]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every validation job
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          CATALOGUE_RESULT: ${{ needs.catalogue.result }}
          DISTRIBUTION_RESULT: ${{ needs.distribution.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          STORAGE_RESULT: ${{ needs.storage.result }}
        run: |
          if [[ "$DISTRIBUTION_RESULT" != "success" || "$QUALITY_RESULT" != "success" || "$CATALOGUE_RESULT" != "success" || "$DISCOVER_RESULT" != "success" || "$VALIDATE_RESULT" != "success" || "$STORAGE_RESULT" != "success" ]]; then
            echo "required checks failed: distribution=$DISTRIBUTION_RESULT quality=$QUALITY_RESULT, catalogue=$CATALOGUE_RESULT, discovery=$DISCOVER_RESULT, validation=$VALIDATE_RESULT, storage=$STORAGE_RESULT"
            exit 1
          fi
      - name: Record the immutable successful integrity context
        env:
          TESTED_COMMIT: ${{ needs.discover.outputs.tested_commit }}
          TESTED_TREE: ${{ needs.discover.outputs.tested_tree }}
          VERIFIER: ${{ needs.discover.outputs.verifier }}
          AUDIT_PLAN: ${{ needs.discover.outputs.plan_sha256 }}
          AUDIT_MODE: ${{ needs.discover.outputs.mode }}
        run: |
          python3 - <<'PY'
          import json, os, re
          fields = {"tested_commit": ("TESTED_COMMIT", 40), "tree": ("TESTED_TREE", 40),
                    "verifier": ("VERIFIER", 64), "plan_sha256": ("AUDIT_PLAN", 64)}
          document = {"format": "hec-integrity-acceptance-v1", "mode": os.environ["AUDIT_MODE"]}
          for key, (variable, length) in fields.items():
              value = os.environ[variable]
              if re.fullmatch("[0-9a-f]{" + str(length) + "}", value) is None:
                  raise SystemExit("invalid immutable integrity context: " + key)
              document[key] = value
          if document["mode"] not in ("full", "incremental"):
              raise SystemExit("invalid integrity acceptance mode")
          print("::notice title=HEC integrity acceptance v1::" + json.dumps(document, separators=(",", ":")))
          PY
