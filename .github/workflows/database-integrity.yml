name: database integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Every checkout stays pointer-only. Only the centralized producer fetches.
  GIT_LFS_SKIP_SMUDGE: "1"
  HEC_CHECK_WORKERS: "2"

concurrency:
  group: database-integrity-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: code quality and tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.13.14"
          enable-cache: true
      - run: uv sync --locked --dev --python 3.13.14
      - run: bash .github/scripts/lint_workflows.sh
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - name: Build installed-package exact primitives
        run: |
          uv run --no-sync hec native build --directory "$RUNNER_TEMP/hec-native"
          echo "HEC_NATIVE_DIR=$RUNNER_TEMP/hec-native" >> "$GITHUB_ENV"
      - run: uv run --no-sync python -m unittest discover -s tests

  discover:
    name: discover datasets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.datasets.outputs.matrix }}
      lfs_required: ${{ steps.lfs.outputs.required }}
      lfs_key: ${{ steps.lfs.outputs.key }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.13.14"
          enable-cache: true
      - run: uv sync --locked --no-dev --python 3.13.14
      - id: lfs
        name: Audit repository inventory and plan only declared immutable objects
        run: uv run --no-sync hec storage plan --github-output "$GITHUB_OUTPUT"
      - id: datasets
        name: Plan complete disjoint standard-proof audits and bindings
        env:
          LFS_NS: ${{ steps.lfs.outputs.ns }}
        run: |
          uv run --no-sync hec plan \
            --lfs-ns-json "$LFS_NS" --github-output "$GITHUB_OUTPUT"

  prepare_lfs:
    name: prepare shared proof cache
    needs: discover
    if: ${{ needs.discover.outputs.lfs_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.13.14"
          enable-cache: true
      - run: uv sync --locked --no-dev --python 3.13.14
      - id: cache
        name: Restore content-addressed declared objects
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .hec-ci-lfs/objects
          key: ${{ needs.discover.outputs.lfs_key }}
          restore-keys: hec-storage-v1-
      - name: Fetch missing active objects once and verify their hashes
        run: |
          uv run --no-sync hec storage populate --fetch
          uv run --no-sync hec storage compact
      - name: Save the verified shared cache
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .hec-ci-lfs/objects
          key: ${{ needs.discover.outputs.lfs_key }}

  validate:
    needs: [discover, prepare_lfs]
    # Small JSON-only checks still run if the LFS quota/cache is unavailable.
    # Checks needing proofs fail explicitly instead of passing with no data.
    if: ${{ !cancelled() && needs.discover.result == 'success' }}
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Every proof payload belongs to one full-cube audit partition.
      # Metadata jobs confer no validity; the gate requires ALL audit partitions.
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.13.14"
          enable-cache: true
      - run: uv sync --locked --no-dev --python 3.13.14
      - name: Require the verified proof handoff when needed
        if: ${{ matrix.lfs && needs.prepare_lfs.result != 'success' }}
        run: |
          echo 'The shared LFS proof cache is unavailable; no checks are being bypassed.'
          exit 1
      - name: Restore proofs without another LFS download
        if: ${{ matrix.lfs }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .hec-ci-lfs/objects
          key: ${{ needs.discover.outputs.lfs_key }}
          fail-on-cache-miss: true
      - name: Install only this dataset's hash-verified proofs
        if: ${{ matrix.lfs }}
        env:
          CHECK_N: ${{ matrix.n }}
          CHECK_KIND: ${{ matrix.kind }}
          CHECK_SHARD_INDEX: ${{ matrix.shard_index }}
          CHECK_SHARD_COUNT: ${{ matrix.shard_count }}
        run: |
          if [[ "$CHECK_KIND" == "contractions" ]]; then
            uv run --no-sync hec storage install --n "$CHECK_N" --shard-index "$CHECK_SHARD_INDEX" --shard-count "$CHECK_SHARD_COUNT"
          else
            uv run --no-sync hec storage install --n "$CHECK_N"
          fi
      - name: Build standard exact decoder and full-cube verifier
        if: ${{ matrix.kind == 'contractions' }}
        run: |
          uv run --no-sync hec native build --directory "$RUNNER_TEMP/hec-native"
          echo "HEC_NATIVE_DIR=$RUNNER_TEMP/hec-native" >> "$GITHUB_ENV"
          echo "HEC_RECONSTRUCTION_WORKING_BYTES=268435456" >> "$GITHUB_ENV"
      - name: Validate ${{ matrix.kind }} for n=${{ matrix.n }}
        env:
          CHECK_KIND: ${{ matrix.kind }}
          CHECK_N: ${{ matrix.n }}
          CHECK_SHARD_INDEX: ${{ matrix.shard_index }}
          CHECK_SHARD_COUNT: ${{ matrix.shard_count }}
          EXPECT_PROOFS: ${{ matrix.expect_proofs }}
          EXPECT_EDGES: ${{ matrix.expect_edges }}
        run: |
          if [[ "$CHECK_KIND" == "contractions" ]]; then
            uv run --no-sync hec check contractions --n "$CHECK_N" \
              --shard-index "$CHECK_SHARD_INDEX" --shard-count "$CHECK_SHARD_COUNT" \
              --expect-proofs "$EXPECT_PROOFS" --expect-edges "$EXPECT_EDGES"
          elif [[ "$CHECK_KIND" == "database-bindings" ]]; then
            uv run --no-sync hec check database-bindings --n "$CHECK_N"
          else
            uv run --no-sync hec check "$CHECK_KIND" --n "$CHECK_N" \
              --shard-index "$CHECK_SHARD_INDEX" --shard-count "$CHECK_SHARD_COUNT"
          fi

  distribution:
    name: installed wheel and exact small-corpus acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.13.14"
          enable-cache: true
      - name: Build the source distribution and its installable wheel
        run: |
          uv build --sdist --python 3.13.14 --out-dir "$RUNNER_TEMP/hec-source"
          uv build "$RUNNER_TEMP/hec-source/"*.tar.gz --wheel --python 3.13.14 --out-dir "$RUNNER_TEMP/hec-dist"
      - name: Install exactly locked runtime dependencies and the wheel
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/hec-requirements.txt"
          uv venv --python 3.13.14 "$RUNNER_TEMP/hec-wheel"
          uv pip sync --python "$RUNNER_TEMP/hec-wheel/bin/python" "$RUNNER_TEMP/hec-requirements.txt"
          uv pip install --no-deps --python "$RUNNER_TEMP/hec-wheel/bin/python" "$RUNNER_TEMP/hec-dist/"*.whl
      - name: Verify from outside the checkout with no research modules or source-path fallback
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ""
        run: |
          "$RUNNER_TEMP/hec-wheel/bin/python" "$GITHUB_WORKSPACE/tests/wheel_smoke.py" \
            --repository "$GITHUB_WORKSPACE" --native-directory "$RUNNER_TEMP/hec-wheel-native"

  gate:
    name: database integrity
    if: ${{ always() }}
    needs: [quality, distribution, discover, prepare_lfs, validate]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every validation job
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          DISTRIBUTION_RESULT: ${{ needs.distribution.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          LFS_RESULT: ${{ needs.prepare_lfs.result }}
        run: |
          if [[ "$DISTRIBUTION_RESULT" != "success" || "$QUALITY_RESULT" != "success" || "$DISCOVER_RESULT" != "success" || "$VALIDATE_RESULT" != "success" || ( "$LFS_RESULT" != "success" && "$LFS_RESULT" != "skipped" ) ]]; then
            echo "required checks failed: distribution=$DISTRIBUTION_RESULT quality=$QUALITY_RESULT, discovery=$DISCOVER_RESULT, validation=$VALIDATE_RESULT, lfs=$LFS_RESULT"
            exit 1
          fi
