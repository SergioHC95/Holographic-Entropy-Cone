name: database integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Every checkout stays pointer-only. Only the centralized producer fetches.
  GIT_LFS_SKIP_SMUDGE: "1"
  HEC_CHECK_WORKERS: "2"

concurrency:
  group: database-integrity-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: code quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.13.14"
          enable-cache: true
      - run: uv sync --locked --dev --python 3.13.14
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync python -m unittest discover -s tests

  discover:
    name: discover datasets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.datasets.outputs.matrix }}
      lfs_required: ${{ steps.lfs.outputs.required }}
      lfs_key: ${{ steps.lfs.outputs.key }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: false
      - id: lfs
        name: Plan only active exact proof shards
        run: python3 .github/scripts/lfs_assets.py plan --github-output "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.13.14"
          enable-cache: true
      - run: uv sync --locked --no-dev --python 3.13.14
      - id: datasets
        name: Plan complete disjoint standard-proof audits and bindings
        env:
          LFS_NS: ${{ steps.lfs.outputs.ns }}
        run: |
          uv run --no-sync python -m hec.reconstruction_checks plan \
            --lfs-ns-json "$LFS_NS" --github-output "$GITHUB_OUTPUT"

  prepare_lfs:
    name: prepare shared proof cache
    needs: discover
    if: ${{ needs.discover.outputs.lfs_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: false
      - id: cache
        name: Look up content-addressed active proofs without downloading
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .hec-ci-lfs/objects
          key: ${{ needs.discover.outputs.lfs_key }}
          lookup-only: true
      - name: Fetch missing active objects once and verify their hashes
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: python3 .github/scripts/lfs_assets.py populate
      - name: Save the verified shared cache
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .hec-ci-lfs/objects
          key: ${{ needs.discover.outputs.lfs_key }}
      - id: handoff
        name: Confirm the matrix can access the shared cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .hec-ci-lfs/objects
          key: ${{ needs.discover.outputs.lfs_key }}
          lookup-only: true
          fail-on-cache-miss: true

  validate:
    needs: [discover, prepare_lfs]
    # Small JSON-only checks still run if the LFS quota/cache is unavailable.
    # Checks needing proofs fail explicitly instead of passing with no data.
    if: ${{ !cancelled() && needs.discover.result == 'success' }}
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Every proof payload belongs to one full-cube audit partition.
      # Metadata jobs confer no validity; the gate requires ALL audit partitions.
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: false
      - name: Require the verified proof handoff when needed
        if: ${{ matrix.lfs && needs.prepare_lfs.result != 'success' }}
        run: |
          echo 'The shared LFS proof cache is unavailable; no checks are being bypassed.'
          exit 1
      - name: Restore proofs without another LFS download
        if: ${{ matrix.lfs }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .hec-ci-lfs/objects
          key: ${{ needs.discover.outputs.lfs_key }}
          fail-on-cache-miss: true
      - name: Install only this dataset's hash-verified proofs
        if: ${{ matrix.lfs }}
        env:
          CHECK_N: ${{ matrix.n }}
          CHECK_KIND: ${{ matrix.kind }}
          CHECK_SHARD_INDEX: ${{ matrix.shard_index }}
          CHECK_SHARD_COUNT: ${{ matrix.shard_count }}
        run: |
          if [[ "$CHECK_KIND" == "contractions" ]]; then
            python3 .github/scripts/lfs_assets.py install --n "$CHECK_N" --shard-index "$CHECK_SHARD_INDEX" --shard-count "$CHECK_SHARD_COUNT"
          else
            python3 .github/scripts/lfs_assets.py install --n "$CHECK_N"
          fi
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.13.14"
          enable-cache: true
      - run: uv sync --locked --no-dev --python 3.13.14
      - name: Build standard exact decoder and full-cube verifier
        if: ${{ matrix.kind == 'contractions' }}
        run: |
          c++ -O3 -std=c++17 -Wall -Wextra -Werror tools/derivation_pilot/closure.cpp -o "$RUNNER_TEMP/hec-closure"
          c++ -O3 -std=c++17 -Wall -Wextra -Werror tools/verify_reconstruction.cpp -o "$RUNNER_TEMP/hec-standard-verifier"
          echo "HEC_RECONSTRUCTION_CLOSURE=$RUNNER_TEMP/hec-closure" >> "$GITHUB_ENV"
          echo "HEC_RECONSTRUCTION_VERIFIER=$RUNNER_TEMP/hec-standard-verifier" >> "$GITHUB_ENV"
          echo "HEC_RECONSTRUCTION_WORKING_BYTES=268435456" >> "$GITHUB_ENV"
      - name: Validate ${{ matrix.kind }} for n=${{ matrix.n }}
        env:
          CHECK_KIND: ${{ matrix.kind }}
          CHECK_N: ${{ matrix.n }}
          CHECK_SHARD_INDEX: ${{ matrix.shard_index }}
          CHECK_SHARD_COUNT: ${{ matrix.shard_count }}
          EXPECT_PROOFS: ${{ matrix.expect_proofs }}
          EXPECT_EDGES: ${{ matrix.expect_edges }}
        run: |
          if [[ "$CHECK_KIND" == "contractions" ]]; then
            uv run --no-sync python -m hec.reconstruction_checks contractions --n "$CHECK_N" \
              --shard-index "$CHECK_SHARD_INDEX" --shard-count "$CHECK_SHARD_COUNT" \
              --expect-proofs "$EXPECT_PROOFS" --expect-edges "$EXPECT_EDGES"
          elif [[ "$CHECK_KIND" == "database-bindings" ]]; then
            uv run --no-sync python -m hec.reconstruction_checks database-bindings --n "$CHECK_N"
          else
            uv run --no-sync python -m hec.checks "$CHECK_KIND" --n "$CHECK_N" \
              --shard-index "$CHECK_SHARD_INDEX" --shard-count "$CHECK_SHARD_COUNT"
          fi

  gate:
    name: database integrity
    if: ${{ always() }}
    needs: [quality, discover, prepare_lfs, validate]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every validation job
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          LFS_RESULT: ${{ needs.prepare_lfs.result }}
        run: |
          if [[ "$QUALITY_RESULT" != "success" || "$DISCOVER_RESULT" != "success" || "$VALIDATE_RESULT" != "success" || ( "$LFS_RESULT" != "success" && "$LFS_RESULT" != "skipped" ) ]]; then
            echo "required checks failed: quality=$QUALITY_RESULT, discovery=$DISCOVER_RESULT, validation=$VALIDATE_RESULT, lfs=$LFS_RESULT"
            exit 1
          fi
